services:
  classifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower-classifier
    ports:
      - "8888:8888"
    working_dir: /workspace/flower-classifier
    volumes:
      # Host-visible code and notebooks
      - ./flower-classifier:/workspace/flower-classifier

      # Host-visible dataset storage
      - ./data:/workspace/data

      # Container-managed caches / model storage
      - torch_cache:/opt/cache/torch
      - hf_cache:/opt/cache/huggingface
      - ultralytics_cache:/opt/cache/ultralytics
      - pip_cache:/root/.cache/pip
      - jupyter_data:/root/.local/share/jupyter

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # Keep framework caches off the host bind mounts
      TORCH_HOME: /opt/cache/torch
      HF_HOME: /opt/cache/huggingface
      TRANSFORMERS_CACHE: /opt/cache/huggingface/transformers
      YOLO_CONFIG_DIR: /opt/cache/ultralytics

      # Jupyter quality-of-life
      JUPYTER_ENABLE_LAB: "yes"

    stdin_open: true
    tty: true
    shm_size: "8gb"

    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=
      --NotebookApp.password=

volumes:
  torch_cache:
  hf_cache:
  ultralytics_cache:
  pip_cache:
  jupyter_data: